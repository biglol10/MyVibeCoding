<!doctype html>
<html lang="ko" data-theme="night"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; font-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-src 'none'"><title>Markdown Reader</title></head>
<body>
<div id="app">
<header class="toolbar"><button id="navigation" class="icon" aria-label="파일과 목차" title="파일과 목차"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><div class="document-title"><strong id="title">Markdown Reader</strong><span id="subtitle">읽기 전용</span></div><button id="find" class="icon" aria-label="본문 검색" title="본문 검색"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></svg></button><button id="preferences" class="icon" aria-label="읽기 설정" title="읽기 설정">Aa</button></header>
<div class="layout"><div id="scrim" hidden></div><aside id="sidebar" aria-label="문서 탐색" inert><div class="sidebar-heading"><strong>내 문서</strong><button id="close-navigation" class="icon" aria-label="탐색 닫기">×</button></div><div class="open-actions"><button data-native="openFile">파일 열기</button><button data-native="openFolder">폴더 열기</button></div><div class="tabs" role="tablist"><button role="tab" data-tab="files" aria-selected="true" aria-controls="files-panel">파일</button><button role="tab" data-tab="outline" aria-selected="false" aria-controls="outline-panel">목차</button></div><section id="files-panel" role="tabpanel"><button id="folder-up" hidden>‹ 상위 폴더</button><div class="folder-heading"><div id="folder-title">폴더를 선택하세요</div><button id="refresh-folder" hidden aria-label="폴더 새로 고침">새로 고침</button></div><div class="side-search"><label class="sr-only" for="folder-query">현재 폴더에서 찾기</label><input id="folder-query" type="search" placeholder="현재 폴더에서 찾기" autocomplete="off" disabled><button id="clear-folder-query" type="button" aria-label="폴더 검색 지우기" hidden>지우기</button></div><div id="files" class="file-list"><p class="muted">폴더 안의 Markdown 문서를 여기서 탐색할 수 있습니다.</p></div></section><section id="outline-panel" role="tabpanel" hidden><div class="side-search"><label class="sr-only" for="outline-query">목차에서 찾기</label><input id="outline-query" type="search" placeholder="목차에서 찾기" autocomplete="off"><button id="clear-outline-query" type="button" aria-label="목차 검색 지우기" hidden>지우기</button></div><div class="outline-actions"><button id="collapse-outline" type="button" disabled>모두 접기</button><button id="expand-outline" type="button" disabled>모두 펼치기</button></div><p id="outline-search-status" class="muted" role="status"></p><p id="outline-status" class="sr-only" role="status"></p><div id="outline"><p class="muted">문서를 열면 목차가 표시됩니다.</p></div></section><p class="sidebar-foot">원본 파일을 변경하지 않습니다.</p></aside>
<main id="reading" tabindex="-1"><section id="welcome"><div class="welcome-mark" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="M12 6h16l8 8v28H12zM28 6v10h8M18 24h12M18 31h9"/></svg></div><p class="eyebrow">나만의 읽기 공간</p><h1>문서를 펼쳐 보세요</h1><p>다운로드한 Markdown 파일이나<br>폴더에 모아 둔 문서를 편하게 읽으세요.</p><div class="welcome-actions"><button class="primary" data-native="openFile">파일 열기</button><button data-native="openFolder">폴더 열기</button></div><p class="welcome-note">읽기 전용 · 원본 그대로 · 오프라인 지원</p></section><article id="document" hidden aria-label="Markdown 문서"></article><div id="loading" role="status" hidden>문서를 여는 중…</div></main></div>
<footer><span id="reading-state">읽기 전용</span><span id="progress"></span></footer>
</div>
<dialog id="settings" aria-labelledby="settings-title"><form method="dialog"><header><h2 id="settings-title">읽기 설정</h2><button class="icon" aria-label="설정 닫기">×</button></header><fieldset><legend>화면</legend><div class="theme-options"><button type="button" data-theme="light">라이트</button><button type="button" data-theme="dark">다크</button><button type="button" data-theme="night">나이트</button></div></fieldset><label>글자 크기 <output id="size-value"></output><input id="font-size" type="range" min="14" max="28" step="1"></label><label>줄 간격 <output id="line-value"></output><input id="line-height" type="range" min="1.5" max="2.2" step="0.1"></label><p class="muted">인터넷 이미지는 문서마다 허용한 뒤 표시합니다.</p><button class="primary">완료</button></form></dialog>
<dialog id="search-dialog" aria-labelledby="search-title"><form id="search-form"><header><h2 id="search-title">본문 검색</h2><button type="button" id="close-search" class="icon" aria-label="검색 닫기">×</button></header><label class="sr-only" for="query">찾을 내용</label><input id="query" type="search" placeholder="찾을 내용" autocomplete="off"><div class="search-controls"><span id="match-count" role="status">검색어를 입력하세요</span><button id="previous-match" type="button" aria-label="이전 결과">↑</button><button id="next-match" type="submit" aria-label="다음 결과">↓</button></div></form></dialog>
<div id="notice" role="status" hidden><span></span><button aria-label="알림 닫기">×</button></div>
<script type="module" src="./reader.ts"></script></body></html>
