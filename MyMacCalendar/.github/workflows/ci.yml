name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Swift Tests
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Check whitespace
        run: git diff --check

      - name: Run tests
        run: swift test --disable-sandbox

      - name: Build app bundle
        run: ./scripts/build_app.sh
