name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  test:
    name: Swift tests and app checks
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Run tests
        run: swift test --enable-code-coverage

      - name: Build Swift package
        run: swift build

      - name: Verify app icon bundle
        run: ./scripts/verify-app-icon.sh

      - name: Build app bundle
        run: ./scripts/build_app.sh
